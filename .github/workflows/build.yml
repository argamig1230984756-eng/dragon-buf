name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build (auto-detect Maven or Gradle)
        run: |
          if [ -f pom.xml ]; then
            mvn -B clean package
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            chmod +x gradlew 2>/dev/null || true
            if [ -f gradlew ]; then ./gradlew build; else gradle build; fi
          else
            echo "No pom.xml or build.gradle in the repo root. Add your plugin project first."
            ls -la
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DragonBuff
          path: |
            target/*.jar
            build/libs/*.jar
